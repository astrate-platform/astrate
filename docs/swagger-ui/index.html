<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrate — API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
    }
    #header {
      background: #1b1b1b;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    #header h1 { font-size: 18px; font-weight: 600; }
    #header select {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2d2d2d;
      color: #fff;
      font-size: 14px;
    }
    #header select option { background: #2d2d2d; color: #fff; }
    #api-badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 12px;
      background: #4a90d9;
      color: #fff;
      font-weight: 500;
    }
    #swagger-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Astrate API Docs</h1>
    <select id="spec-selector" aria-label="Select API spec">
      <option value="../api/astarte_appengine_api.yaml">Astrate AppEngine API (15 ops)</option>
      <option value="../api/astarte_realm_management_api.yaml">Astrate Realm Management API (19 ops)</option>
      <option value="../api/astarte_pairing_api.yaml">Astrate Pairing API (5 ops)</option>
      <option value="../api/astarte_housekeeping_api.yaml">Astrate Housekeeping API (4 ops)</option>
      <option value="../api/astrate_native_api.yaml">Astrate Native API (8 ops)</option>
    </select>
    <span id="api-badge">OpenAPI 3.0</span>
  </div>

  <div id="swagger-container">
    <div id="swagger-ui" class="loading">Loading API spec…</div>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    (function () {
      const specUrl = new URLSearchParams(window.location.search).get('spec');
      const selector = document.getElementById('spec-selector');

      if (specUrl) {
        selector.value = specUrl;
      }

      function renderSwagger(url) {
        const container = document.getElementById('swagger-ui');
        container.innerHTML = '';
        container.classList.remove('loading');

        SwaggerUIBundle({
          url: new URL(url, window.location.href).href,
          dom_id: '#swagger-ui',
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'BaseLayout',
          deepLinking: true,
          tryItOutEnabled: false,
          docExpansion: 'list',
          defaultModelsExpandDepth: -1,
          validatorUrl: null,
        });
      }

      selector.addEventListener('change', function () {
        window.history.replaceState(null, '', '?spec=' + encodeURIComponent(this.value));
        renderSwagger(this.value);
      });

      renderSwagger(selector.value);
    })();
  </script>
</body>
</html>
