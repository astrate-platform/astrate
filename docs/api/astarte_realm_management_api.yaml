openapi: "3.0.3"
info:
  title: Astarte Realm Management API
  description: |
    Realm-level administration API for Astrate. Manages interfaces, triggers,
    trigger delivery policies, auth configuration, device registration limits,
    and device lifecycle within a single realm.

    All endpoints are guarded by a realm JWT carrying the `a_rma` claim.
  version: "0.0.1"
  license:
    name: "Apache-2.0 with SECO Exclusion"
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: "{base_url}"
    variables:
      base_url:
        default: http://localhost:8080
        description: Astrate base URL

security: []

paths:
  # ── Interfaces ──────────────────────────────────────────────────────

  /realmmanagement/v1/{realm}/interfaces:
    get:
      operationId: listInterfaces
      summary: List all installed interfaces
      description: Returns the names of all interfaces installed in the realm.
      tags: [Realm Management - Interfaces]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: A list of interface names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStringArray"
              example:
                data:
                  - org.example.Sensors
                  - org.example.Actuators
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: installInterface
      summary: Install a new interface
      description: |
        Installs a new interface definition in the realm. The request body
        contains the raw JSON interface definition (wrapped in a data envelope).
      tags: [Realm Management - Interfaces]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: Astarte interface definition.
                  $ref: "#/components/schemas/InterfaceDefinition"
      responses:
        "201":
          description: Interface installed. Returns the installed interface definition.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    description: Installed interface definition.
                    $ref: "#/components/schemas/InterfaceDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /realmmanagement/v1/{realm}/interfaces/{name}:
    get:
      operationId: listInterfaceMajors
      summary: List major versions of an interface
      description: Returns the installed major version numbers for the named interface.
      tags: [Realm Management - Interfaces]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/InterfaceName"
      responses:
        "200":
          description: A list of major version numbers.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIntArray"
              example:
                data:
                  - 0
                  - 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /realmmanagement/v1/{realm}/interfaces/{name}/{major}:
    get:
      operationId: getInterface
      summary: Get an interface definition
      description: Returns the full interface definition for a specific major version.
      tags: [Realm Management - Interfaces]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/InterfaceName"
        - $ref: "#/components/parameters/MajorVersion"
      responses:
        "200":
          description: Interface definition.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    description: Interface definition JSON.
                    $ref: "#/components/schemas/InterfaceDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: updateInterface
      summary: Update an interface definition
      description: |
        Updates an existing interface definition (same major version). Returns
        204 on success with no body.
      tags: [Realm Management - Interfaces]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/InterfaceName"
        - $ref: "#/components/parameters/MajorVersion"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: Updated interface definition.
                  type: object
      responses:
        "204":
          description: Interface updated. No body returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteInterface
      summary: Delete an interface
      description: |
        Deletes an interface at a specific major version. Fails if the major
        version is not 0 or if the interface is still used by device introspection.
        Returns 204 on success.
      tags: [Realm Management - Interfaces]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/InterfaceName"
        - $ref: "#/components/parameters/MajorVersion"
      responses:
        "204":
          description: Interface deleted. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Unprocessable Entity — major version not 0 or interface in use.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              examples:
                major_not_zero:
                  summary: Major version is not 0
                  value:
                    errors:
                      detail: "Interface major version is not 0, can't be deleted"
                in_use:
                  summary: Interface in use by device
                  value:
                    errors:
                      detail: "Cannot delete an interface that is used by a device introspection"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Triggers ────────────────────────────────────────────────────────

  /realmmanagement/v1/{realm}/triggers:
    get:
      operationId: listTriggers
      summary: List all triggers
      description: Returns the names of all triggers in the realm.
      tags: [Realm Management - Triggers]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: A list of trigger names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStringArray"
              example:
                data:
                  - example_trigger
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createTrigger
      summary: Create a new trigger
      description: |
        Creates a new trigger. The request body contains the raw JSON trigger
        definition (wrapped in a data envelope).
      tags: [Realm Management - Triggers]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: Astarte trigger definition.
                  $ref: "#/components/schemas/TriggerDefinition"
      responses:
        "201":
          description: Trigger created. Returns the trigger definition.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    description: Trigger definition JSON.
                    $ref: "#/components/schemas/TriggerDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /realmmanagement/v1/{realm}/triggers/{name}:
    get:
      operationId: getTrigger
      summary: Get a trigger definition
      description: Returns the full trigger definition.
      tags: [Realm Management - Triggers]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/TriggerName"
      responses:
        "200":
          description: Trigger definition.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    description: Trigger definition JSON.
                    $ref: "#/components/schemas/TriggerDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteTrigger
      summary: Delete a trigger
      description: Deletes a trigger by name. Returns 204 on success.
      tags: [Realm Management - Triggers]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/TriggerName"
      responses:
        "204":
          description: Trigger deleted. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Config / Auth ──────────────────────────────────────────────────

  /realmmanagement/v1/{realm}/config/auth:
    get:
      operationId: getAuthConfig
      summary: Get realm auth configuration
      description: Returns the realm's JWT public key PEM.
      tags: [Realm Management - Config]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: Auth configuration.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AuthConfig"
              example:
                data:
                  jwt_public_key_pem: |
                    -----BEGIN PUBLIC KEY-----
                    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
                    -----END PUBLIC KEY-----
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: putAuthConfig
      summary: Update realm auth configuration
      description: Updates the realm's JWT public key PEM. Returns 204 on success.
      tags: [Realm Management - Config]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/AuthConfig"
            example:
              data:
                jwt_public_key_pem: |
                  -----BEGIN PUBLIC KEY-----
                  MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
                  -----END PUBLIC KEY-----
      responses:
        "204":
          description: Auth configuration updated. No body returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /realmmanagement/v1/{realm}/config/device_registration_limit:
    get:
      operationId: getDeviceRegistrationLimit
      summary: Get device registration limit
      description: Returns the realm's device registration limit (null if unlimited).
      tags: [Realm Management - Config]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: Device registration limit.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: integer
                    format: int32
                    nullable: true
                    description: Device registration limit. Null means unlimited.
              example:
                data: 100
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Version ─────────────────────────────────────────────────────────

  /realmmanagement/v1/{realm}/version:
    get:
      operationId: getVersion
      summary: Get emulated API version
      description: |
        Returns the emulated upstream API compatibility version. The Astarte
        Dashboard gates feature UI on this value.
      tags: [Realm Management - Misc]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: API compatibility version.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: string
                    description: Version string.
              example:
                data: "1.1.0"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Device lifecycle ────────────────────────────────────────────────

  /realmmanagement/v1/{realm}/devices/{device}:
    delete:
      operationId: deleteDevice
      summary: Delete a device
      description: |
        Synchronously deletes a device and all its data. This is a deliberate
        deviation from upstream's async deletion (see COMPATIBILITY.md).
        Returns 204 on success.
      tags: [Realm Management - Devices]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "204":
          description: Device deleted. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Trigger delivery policies ───────────────────────────────────────

  /realmmanagement/v1/{realm}/policies:
    get:
      operationId: listPolicies
      summary: List trigger delivery policies
      description: Returns the names of all trigger delivery policies in the realm.
      tags: [Realm Management - Policies]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: A list of policy names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStringArray"
              example:
                data:
                  - default_policy
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createPolicy
      summary: Create a trigger delivery policy
      description: |
        Creates a new trigger delivery policy. The request body contains the
        raw JSON policy definition (wrapped in a data envelope).
      tags: [Realm Management - Policies]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: Trigger delivery policy definition.
                  $ref: "#/components/schemas/TriggerPolicyDefinition"
      responses:
        "201":
          description: Policy created. Returns the policy definition.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    description: Policy definition JSON.
                    $ref: "#/components/schemas/TriggerPolicyDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /realmmanagement/v1/{realm}/policies/{name}:
    get:
      operationId: getPolicy
      summary: Get a trigger delivery policy
      description: Returns the full policy definition.
      tags: [Realm Management - Policies]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/PolicyName"
      responses:
        "200":
          description: Policy definition.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    description: Policy definition JSON.
                    $ref: "#/components/schemas/TriggerPolicyDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deletePolicy
      summary: Delete a trigger delivery policy
      description: Deletes a policy by name. Returns 204 on success.
      tags: [Realm Management - Policies]
      security:
        - a_rma: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/PolicyName"
      responses:
        "204":
          description: Policy deleted. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    a_rma:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Realm-level JWT carrying the `a_rma` claim. Used to authenticate
        realm management operations (interfaces, triggers, config, policies).

  parameters:
    RealmName:
      name: realm
      in: path
      required: true
      description: The realm name.
      schema:
        type: string

    InterfaceName:
      name: name
      in: path
      required: true
      description: The interface name (e.g. `org.example.Sensors`).
      schema:
        type: string

    MajorVersion:
      name: major
      in: path
      required: true
      description: The interface major version number (integer >= 0).
      schema:
        type: integer
        minimum: 0

    TriggerName:
      name: name
      in: path
      required: true
      description: The trigger name.
      schema:
        type: string

    DeviceID:
      name: device
      in: path
      required: true
      description: The device hardware ID.
      schema:
        type: string

    PolicyName:
      name: name
      in: path
      required: true
      description: The trigger delivery policy name.
      schema:
        type: string

  schemas:
    # ── Config types ──

    AuthConfig:
      type: object
      required: [jwt_public_key_pem]
      properties:
        jwt_public_key_pem:
          type: string
          description: PEM-encoded JWT public key for the realm.

    # ── Realm Management documents ──

    InterfaceDefinition:
      type: object
      required: [interface_name, version_major, version_minor, type, ownership, mappings]
      additionalProperties: false
      properties:
        interface_name:
          type: string
          maxLength: 128
          pattern: '^([a-zA-Z][a-zA-Z0-9]*\.([a-zA-Z0-9][a-zA-Z0-9-]*\.)*)?[a-zA-Z][a-zA-Z0-9]*$'
        version_major:
          type: integer
          minimum: 0
        version_minor:
          type: integer
          minimum: 0
        type:
          type: string
          enum: [datastream, properties]
        ownership:
          type: string
          enum: [device, server]
        aggregation:
          type: string
          enum: [individual, object]
          default: individual
        description:
          type: string
        doc:
          type: string
        mappings:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: "#/components/schemas/InterfaceMapping"

    InterfaceMapping:
      type: object
      required: [endpoint, type]
      additionalProperties: false
      properties:
        endpoint:
          type: string
          description: Rooted endpoint path. Parametric segments use the `%{name}` form.
          example: /%{sensor_id}/value
        type:
          type: string
          enum: [double, integer, boolean, longinteger, string, binaryblob, datetime, doublearray, integerarray, booleanarray, longintegerarray, stringarray, binaryblobarray, datetimearray]
        reliability:
          type: string
          enum: [unreliable, guaranteed, unique]
          default: unreliable
        retention:
          type: string
          enum: [discard, volatile, stored]
          default: discard
        expiry:
          type: integer
          format: int64
          minimum: 0
          default: 0
        database_retention_policy:
          type: string
          enum: [no_ttl, use_ttl]
          default: no_ttl
        database_retention_ttl:
          type: integer
          format: int64
          minimum: 1
        allow_unset:
          type: boolean
          default: false
        explicit_timestamp:
          type: boolean
          default: false
        description:
          type: string
        doc:
          type: string

    TriggerDefinition:
      type: object
      required: [name, action, simple_triggers]
      properties:
        name:
          type: string
          description: Trigger name. String names are accepted by Astrate; upstream-compatible raw values round-trip.
        policy:
          type: string
          description: Optional trigger delivery policy name.
        action:
          $ref: "#/components/schemas/TriggerAction"
        simple_triggers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SimpleTrigger"

    SimpleTrigger:
      type: object
      required: [type, on]
      properties:
        type:
          type: string
          enum: [data_trigger, device_trigger]
        on:
          type: string
          enum: [incoming_data, value_change, value_change_applied, path_created, path_removed, value_stored, device_connected, device_disconnected, device_empty_cache_received, device_error, incoming_introspection, interface_added, interface_removed, interface_minor_updated]
        group_name:
          type: string
          description: Accepted for upstream compatibility; group-scoped triggers are not evaluated in Astrate v1.
        device_id:
          type: string
          description: Device ID or `*` wildcard.
        interface_name:
          type: string
          description: Interface name or `*` wildcard where supported.
        interface_major:
          type: integer
          minimum: 0
        match_path:
          type: string
          description: Concrete or parametric path, or `/*` wildcard.
        value_match_operator:
          type: string
          enum: ["*", "==", "!=", ">", ">=", "<", "<=", contains, not_contains]
        known_value:
          description: Value used by value_match_operator comparisons.

    TriggerAction:
      type: object
      description: HTTP webhook action or a custom action object for the Forwarder extension point.
      properties:
        http_url:
          type: string
          format: uri
        http_method:
          type: string
          enum: [delete, get, head, options, patch, post, put]
        http_post_url:
          type: string
          format: uri
          description: Legacy shorthand for a POST webhook.
        http_static_headers:
          type: object
          additionalProperties:
            type: string
        ignore_ssl_errors:
          type: boolean
          default: false
        template:
          type: string
          description: Accepted for upstream compatibility; Astrate v1 sends the default JSON envelope.
        template_type:
          type: string
          description: Accepted for upstream compatibility; Astrate v1 sends the default JSON envelope.
      additionalProperties: true

    TriggerPolicyDefinition:
      type: object
      required: [name, error_handlers, maximum_capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_.~-]{1,128}$'
        error_handlers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TriggerPolicyErrorHandler"
        maximum_capacity:
          type: integer
          minimum: 1
        retry_times:
          type: integer
          minimum: 1
          maximum: 100
          description: Required when any handler uses the retry strategy; forbidden otherwise.
        event_ttl:
          type: integer
          minimum: 0
          description: Optional event time-to-live in seconds.

    TriggerPolicyErrorHandler:
      type: object
      required: [on, strategy]
      properties:
        on:
          oneOf:
            - type: string
              enum: [any_error, client_error, server_error]
            - type: array
              minItems: 1
              items:
                type: integer
                minimum: 400
                maximum: 599
            - type: object
              required: [custom_status_codes]
              properties:
                custom_status_codes:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    minimum: 400
                    maximum: 599
        strategy:
          type: string
          enum: [discard, retry]

    # ── Envelope variants ──

    DataEnvelopeStringArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: string

    DataEnvelopeIntArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: integer

    # ── Error envelopes ──

    ErrorDetail:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          required: [detail]
          properties:
            detail:
              type: string

  responses:
    BadRequest:
      description: Bad Request — malformed or missing data envelope.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Bad Request

    Unauthorized:
      description: Unauthorized — missing or invalid JWT.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Unauthorized

    NotFound:
      description: Not Found — resource does not exist.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Not Found

    DeviceNotFound:
      description: Device not found — unknown device ID.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Device not found

    Conflict:
      description: Conflict — resource already exists.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Already exists

    ValidationError:
      description: Unprocessable Entity — request body failed validation.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: "realm: validation failed: interface definition is invalid"

    InternalServerError:
      description: Internal Server Error — unexpected failure.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Internal Server Error
