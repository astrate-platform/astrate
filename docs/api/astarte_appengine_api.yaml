openapi: "3.0.3"
info:
  title: Astarte AppEngine API
  description: |
    Device data and group management API for Astrate. Provides device listing,
    device details, interface data CRUD, and group operations.

    All endpoints are guarded by a realm JWT carrying the `a_aea` claim.
  version: "0.0.1"
  license:
    name: "Apache-2.0 with SECO Exclusion"
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: "{base_url}"
    variables:
      base_url:
        default: http://localhost:8080
        description: Astrate base URL

security: []

paths:
  # ── Devices ─────────────────────────────────────────────────────────

  /appengine/v1/{realm}/devices:
    get:
      operationId: listDevices
      summary: List devices in a realm
      description: |
        Returns a paginated list of device IDs (or device status objects when
        `details=true`). Supports cursor-based pagination via `links.next`.
      tags: [AppEngine - Devices]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: details
          in: query
          schema:
            type: boolean
            default: false
          description: When true, return full device status objects instead of just IDs.
        - name: from_token
          in: query
          schema:
            type: string
          description: Pagination cursor — start after this device token.
        - name: limit
          in: query
          schema:
            type: integer
          description: Maximum number of devices to return.
      responses:
        "200":
          description: Paginated list of devices.
          content:
            application/json; charset=utf-8:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DataEnvelopeDeviceIDList"
                  - $ref: "#/components/schemas/DataEnvelopeDeviceStatusList"
              examples:
                ids:
                  summary: Simple device ID list
                  value:
                    data:
                      - dT6hS2W9TT6LEnP25ks_lg
                    links:
                      self: "/v1/test/devices?details=false&limit=1"
                details:
                  summary: Device status list with pagination
                  value:
                    data:
                      - id: dT6hS2W9TT6LEnP25ks_lg
                        aliases: {}
                        attributes: {}
                        connected: true
                        last_connection: "2024-05-30 13:49:57.045Z"
                        first_registration: "2024-01-15 10:00:00.000Z"
                        last_disconnection: null
                        credentials_inhibited: false
                        groups: []
                        total_received_msgs: 12
                        total_received_bytes: 4096
                        introspection:
                          org.example.Sensors:
                            major: 0
                            minor: 1
                    links:
                      self: "/v1/test/devices?details=true&limit=1"
                      next: "/v1/test/devices?details=true&from_token=dT6hS2W9TT6LEnP25ks_lg&limit=1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/stats/devices:
    get:
      operationId: getDeviceStats
      summary: Get device statistics
      description: Returns total and connected device counts for the realm.
      tags: [AppEngine - Devices]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: Device statistics.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [connected_devices, total_devices]
                    properties:
                      connected_devices:
                        type: integer
                        format: int64
                      total_devices:
                        type: integer
                        format: int64
              example:
                data:
                  connected_devices: 42
                  total_devices: 150
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/devices/{device}:
    get:
      operationId: getDevice
      summary: Get device details
      description: Returns the full device status object.
      tags: [AppEngine - Devices]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: Device status.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeviceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: patchDevice
      summary: Update device attributes
      description: |
        Partially updates a device's aliases, attributes, or credentials
        inhibited status. Returns the updated device status.
      tags: [AppEngine - Devices]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/DevicePatch"
            example:
              data:
                aliases:
                  serial_number: "ABC123"
                attributes:
                  firmware_version: "2.1.0"
                credentials_inhibited: false
      responses:
        "200":
          description: Updated device status.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeviceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "409":
          $ref: "#/components/responses/ConflictAliasInUse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/devices-by-alias/{alias}:
    get:
      operationId: getDeviceByAlias
      summary: Get device by alias
      description: Returns the device status for a device matching the given alias.
      tags: [AppEngine - Devices]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
      responses:
        "200":
          description: Device status.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeviceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: patchDeviceByAlias
      summary: Update device attributes by alias
      description: |
        Partially updates a device's aliases, attributes, or credentials
        inhibited status, looked up by alias. Returns the updated device status.
      tags: [AppEngine - Devices]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/DevicePatch"
            example:
              data:
                aliases:
                  serial_number: "ABC123"
                attributes:
                  firmware_version: "2.1.0"
                credentials_inhibited: false
      responses:
        "200":
          description: Updated device status.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeviceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/devices-by-alias/{alias}/interfaces:
    get:
      operationId: listInterfacesByAlias
      summary: List interfaces by alias
      description: |
        Returns the names of all interfaces currently exposed by a device
        looked up by alias.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
      responses:
        "200":
          description: List of interface names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStringArray"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/devices-by-alias/{alias}/interfaces/{interface}:
    get:
      operationId: getDataByAlias
      summary: Get interface data by alias
      description: |
        Returns the data for a device interface, looked up by alias. Supports
        optional query parameters for time-range filtering and downsampling on
        datastream interfaces.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
        - $ref: "#/components/parameters/InterfaceName"
        - $ref: "#/components/parameters/DataSince"
        - $ref: "#/components/parameters/DataSinceAfter"
        - $ref: "#/components/parameters/DataTo"
        - $ref: "#/components/parameters/DataLimit"
        - $ref: "#/components/parameters/DataDownsample"
        - $ref: "#/components/parameters/DataSort"
        - $ref: "#/components/parameters/DataFormat"
        - $ref: "#/components/parameters/DataAllowBigIntegers"
        - $ref: "#/components/parameters/DataAllowSafeBigIntegers"
      responses:
        "200":
          description: Interface data.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/devices-by-alias/{alias}/interfaces/{interface}/{path}:
    get:
      operationId: getDataAtPathByAlias
      summary: Get data at path by alias
      description: |
        Returns data for a specific path within a device interface, looked up
        by alias.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path (e.g. `/sensors/temperature/value`).
          schema:
            type: string
        - $ref: "#/components/parameters/DataSince"
        - $ref: "#/components/parameters/DataSinceAfter"
        - $ref: "#/components/parameters/DataTo"
        - $ref: "#/components/parameters/DataLimit"
        - $ref: "#/components/parameters/DataDownsample"
        - $ref: "#/components/parameters/DataSort"
        - $ref: "#/components/parameters/DataFormat"
        - $ref: "#/components/parameters/DataAllowBigIntegers"
        - $ref: "#/components/parameters/DataAllowSafeBigIntegers"
      responses:
        "200":
          description: Path data.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: putDataByAlias
      summary: Set data at path by alias
      description: |
        Sets the value at a specific path in a device interface (server-owned
        data), looked up by alias. Returns 200 on success.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: The value to set.
      responses:
        "200":
          description: Data set successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/ValueTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: publishDataByAlias
      summary: Publish data at path by alias
      description: |
        Alias for PUT — publishes a value to a device interface path, looked
        up by alias. Returns 200 on success.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: The value to publish.
      responses:
        "200":
          description: Data published successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/ValueTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteDataByAlias
      summary: Delete data at path by alias
      description: |
        Unsets the property at a specific path (properties interface only),
        looked up by alias. Returns 204 on success.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - name: alias
          in: path
          required: true
          description: The alias value to look up.
          schema:
            type: string
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      responses:
        "204":
          description: Data deleted. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/devices/{device}/interfaces:
    get:
      operationId: listDeviceInterfaces
      summary: List device interfaces
      description: |
        Returns the names of all interfaces currently exposed by a device.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: List of interface names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStringArray"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Interface data ──────────────────────────────────────────────────

  /appengine/v1/{realm}/devices/{device}/interfaces/{interface}:
    get:
      operationId: getData
      summary: Get interface data
      description: |
        Returns the data for a device's interface. Supports optional query
        parameters for time-range filtering and downsampling on datastream
        interfaces.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - $ref: "#/components/parameters/DataSince"
        - $ref: "#/components/parameters/DataSinceAfter"
        - $ref: "#/components/parameters/DataTo"
        - $ref: "#/components/parameters/DataLimit"
        - $ref: "#/components/parameters/DataDownsample"
        - $ref: "#/components/parameters/DataSort"
        - $ref: "#/components/parameters/DataFormat"
        - $ref: "#/components/parameters/DataAllowBigIntegers"
        - $ref: "#/components/parameters/DataAllowSafeBigIntegers"
      responses:
        "200":
          description: Interface data.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/devices/{device}/interfaces/{interface}/{path}:
    get:
      operationId: getDataAtPath
      summary: Get data at path
      description: Returns data for a specific path within a device interface.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path (e.g. `/sensors/temperature/value`).
          schema:
            type: string
        - $ref: "#/components/parameters/DataSince"
        - $ref: "#/components/parameters/DataSinceAfter"
        - $ref: "#/components/parameters/DataTo"
        - $ref: "#/components/parameters/DataLimit"
        - $ref: "#/components/parameters/DataDownsample"
        - $ref: "#/components/parameters/DataSort"
        - $ref: "#/components/parameters/DataFormat"
        - $ref: "#/components/parameters/DataAllowBigIntegers"
        - $ref: "#/components/parameters/DataAllowSafeBigIntegers"
      responses:
        "200":
          description: Path data.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: putData
      summary: Set data at path
      description: |
        Sets the value at a specific path in a device interface (server-owned
        data). Returns 200 on success.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: The value to set.
      responses:
        "200":
          description: Data set successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/ValueTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: publishData
      summary: Publish data at path
      description: |
        Alias for PUT — publishes a value to a device interface path.
        Returns 200 on success.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: The value to publish.
      responses:
        "200":
          description: Data published successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/ValueTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteData
      summary: Delete data at path
      description: |
        Unsets the property at a specific path (properties interface only).
        Returns 204 on success.
      tags: [AppEngine - Data]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      responses:
        "204":
          description: Data deleted. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Groups ──────────────────────────────────────────────────────────

  /appengine/v1/{realm}/groups:
    get:
      operationId: listGroups
      summary: List groups
      description: Returns the names of all groups in the realm.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: A list of group names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStringArray"
              example:
                data:
                  - sensors
                  - actuators
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createGroup
      summary: Create a group
      description: |
        Creates a new device group with an optional initial list of devices.
        Returns the created group body.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/GroupCreate"
            example:
              data:
                group_name: sensors
                devices:
                  - dT6hS2W9TT6LEnP25ks_lg
      responses:
        "201":
          description: Group created.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GroupCreate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/groups/{group}:
    get:
      operationId: getGroup
      summary: Get group info
      description: Returns the group identity (group name).
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
      responses:
        "200":
          description: Group info.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeGroupInfo"
              example:
                data:
                  group_name: sensors
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/groups/{group}/devices:
    get:
      operationId: listGroupDevices
      summary: List devices in a group
      description: |
        Returns the device IDs (or status objects when `details=true`) in the
        specified group.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - name: details
          in: query
          schema:
            type: boolean
            default: false
          description: When true, return full device status objects.
        - name: from_token
          in: query
          schema:
            type: string
          description: Pagination cursor (UUID v1 format) — start after this device.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
          description: Maximum number of devices to return (defaults to 100).
      responses:
        "200":
          description: Group devices.
          content:
            application/json; charset=utf-8:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DataEnvelopeDeviceIDList"
                  - $ref: "#/components/schemas/DataEnvelopeDeviceStatusList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: addGroupDevice
      summary: Add a device to a group
      description: Adds a device to the specified group. Returns 201 on success.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [device_id]
                  properties:
                    device_id:
                      type: string
                      description: The device ID to add.
            example:
              data:
                device_id: dT6hS2W9TT6LEnP25ks_lg
      responses:
        "201":
          description: Device added to group. No body returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/groups/{group}/devices/{device}:
    get:
      operationId: getGroupDevice
      summary: Get group device details
      description: |
        Returns the device status for a device within a group, gated on group
        membership.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: Device status.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeviceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: patchGroupDevice
      summary: Update group device attributes
      description: |
        Partially updates a device's aliases, attributes, or credentials
        inhibited status within a group. Returns the updated device status.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/DevicePatch"
            example:
              data:
                aliases:
                  serial_number: "ABC123"
                attributes:
                  firmware_version: "2.1.0"
                credentials_inhibited: false
      responses:
        "200":
          description: Updated device status.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeviceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictAliasInUse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: removeGroupDevice
      summary: Remove a device from a group
      description: Removes a device from the specified group. Returns 204 on success.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "204":
          description: Device removed. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/groups/{group}/devices/{device}/interfaces:
    get:
      operationId: listInterfacesInGroup
      summary: List interfaces in group for device
      description: |
        Returns the names of all interfaces currently exposed by a device
        within a group.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: List of interface names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStringArray"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/groups/{group}/devices/{device}/interfaces/{interface}:
    get:
      operationId: getDataInGroup
      summary: Get interface data in group
      description: |
        Returns the data for a device's interface within a group. Supports
        optional query parameters for time-range filtering and downsampling on
        datastream interfaces.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - $ref: "#/components/parameters/DataSince"
        - $ref: "#/components/parameters/DataSinceAfter"
        - $ref: "#/components/parameters/DataTo"
        - $ref: "#/components/parameters/DataLimit"
        - $ref: "#/components/parameters/DataDownsample"
        - $ref: "#/components/parameters/DataSort"
        - $ref: "#/components/parameters/DataFormat"
        - $ref: "#/components/parameters/DataAllowBigIntegers"
        - $ref: "#/components/parameters/DataAllowSafeBigIntegers"
      responses:
        "200":
          description: Interface data.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /appengine/v1/{realm}/groups/{group}/devices/{device}/interfaces/{interface}/{path}:
    get:
      operationId: getDataAtPathInGroup
      summary: Get data at path in group
      description: Returns data for a specific path within a device interface in a group.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path (e.g. `/sensors/temperature/value`).
          schema:
            type: string
        - $ref: "#/components/parameters/DataSince"
        - $ref: "#/components/parameters/DataSinceAfter"
        - $ref: "#/components/parameters/DataTo"
        - $ref: "#/components/parameters/DataLimit"
        - $ref: "#/components/parameters/DataDownsample"
        - $ref: "#/components/parameters/DataSort"
        - $ref: "#/components/parameters/DataFormat"
        - $ref: "#/components/parameters/DataAllowBigIntegers"
        - $ref: "#/components/parameters/DataAllowSafeBigIntegers"
      responses:
        "200":
          description: Path data.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: putDataInGroup
      summary: Set data at path in group
      description: |
        Sets the value at a specific path in a device interface (server-owned
        data) within a group. Returns 200 on success.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: The value to set.
      responses:
        "200":
          description: Data set successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/ValueTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: publishDataInGroup
      summary: Publish data at path in group
      description: |
        Alias for PUT — publishes a value to a device interface path within
        a group. Returns 200 on success.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: The value to publish.
      responses:
        "200":
          description: Data published successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/ValueTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteDataInGroup
      summary: Delete data at path in group
      description: |
        Unsets the property at a specific path (properties interface only),
        within a group. Returns 204 on success.
      tags: [AppEngine - Groups]
      security:
        - a_aea: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/InterfaceName"
        - name: path
          in: path
          required: true
          description: The data path.
          schema:
            type: string
      responses:
        "204":
          description: Data deleted. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    a_aea:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Realm-level JWT carrying the `a_aea` claim. Used to authenticate
        AppEngine operations (device data, groups).

  parameters:
    RealmName:
      name: realm
      in: path
      required: true
      description: The realm name.
      schema:
        type: string

    DeviceID:
      name: device
      in: path
      required: true
      description: The device hardware ID.
      schema:
        type: string

    InterfaceName:
      name: interface
      in: path
      required: true
      description: The interface name.
      schema:
        type: string

    GroupName:
      name: group
      in: path
      required: true
      description: The group name.
      schema:
        type: string

    DataSince:
      name: since
      in: query
      schema:
        type: string
        format: date-time
      description: Return data points since this timestamp (RFC 3339).

    DataSinceAfter:
      name: since_after
      in: query
      schema:
        type: string
        format: date-time
      description: Return data points strictly after this timestamp (RFC 3339).

    DataTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
      description: Return data points up to this timestamp (RFC 3339).

    DataLimit:
      name: limit
      in: query
      schema:
        type: integer
      description: Maximum number of data points to return.

    DataDownsample:
      name: downsample_to
      in: query
      schema:
        type: integer
      description: Downsample to this many data points (must be > 2).

    DataSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [ascending, descending]
        default: descending
      description: Sort order for datastream results.

    DataFormat:
      name: format
      in: query
      schema:
        type: string
        enum: [structured, table, disjoint_tables]
        default: structured
      description: |
        Output format for the returned data. `structured` (the default) returns
        flat objects; `table` returns a `{data, metadata}` envelope with rows
        aligned to a sorted `table_header`; `disjoint_tables` pivots to a map of
        column name to `[value, timestamp]` pairs.

    DataAllowBigIntegers:
      name: allow_bigintegers
      in: query
      schema:
        type: boolean
        default: false
      description: |
        When false, big-integer (longinteger) values on object interfaces are
        serialized as decimal strings so no JavaScript caller loses precision.

    DataAllowSafeBigIntegers:
      name: allow_safe_bigintegers
      in: query
      schema:
        type: boolean
        default: false
      description: |
        When true, big-integer (longinteger) values on object interfaces stay
        numbers when they fit JavaScript's safe integer range (|v| ≤ 9007199254740991)
        and fall back to decimal strings otherwise.

  schemas:
    # ── Device types ──

    DeviceStatus:
      type: object
      required: [id, connected]
      properties:
        id:
          type: string
        aliases:
          type: object
          additionalProperties:
            type: string
          nullable: true
        attributes:
          type: object
          additionalProperties:
            type: string
          nullable: true
        connected:
          type: boolean
        last_connection:
          type: string
          nullable: true
          description: Timestamp of last connection (Elixir DateTime format).
        first_registration:
          type: string
          nullable: true
          description: Timestamp of first registration.
        last_disconnection:
          type: string
          nullable: true
          description: Timestamp of last disconnection.
        credentials_inhibited:
          type: boolean
        groups:
          type: array
          items:
            type: string
          description: Group names the device belongs to.
        total_received_msgs:
          type: integer
          format: int64
        total_received_bytes:
          type: integer
          format: int64
        first_credentials_request:
          type: string
          nullable: true
          description: Timestamp of first credentials request.
        last_seen_ip:
          type: string
          description: Last seen IP address. Omitted when never seen.
        previous_interfaces:
          $ref: "#/components/schemas/Introspection"
          nullable: true
          description: Introspection before the last update, when present.
        introspection:
          $ref: "#/components/schemas/Introspection"
          nullable: true
          description: Map of interface name to its major and minor version.

    Introspection:
      type: object
      additionalProperties:
        type: object
        required: [major, minor]
        properties:
          major:
            type: integer
          minor:
            type: integer

    DevicePatch:
      type: object
      properties:
        aliases:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: Aliases to set. Null values remove the alias.
        attributes:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: Attributes to set. Null values remove the attribute.
        credentials_inhibited:
          type: boolean
          nullable: true
          description: Set to true to inhibit device credentials.

    GroupCreate:
      type: object
      required: [group_name]
      properties:
        group_name:
          type: string
          description: The group name.
        devices:
          type: array
          items:
            type: string
          description: Initial list of device IDs in the group.

    GroupInfo:
      type: object
      required: [group_name]
      properties:
        group_name:
          type: string
          description: The group name.

    # ── Envelope variants ──

    DataEnvelopeGroupInfo:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/GroupInfo"

    DataEnvelopeDeviceStatus:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DeviceStatus"

    DataEnvelopeDeviceIDList:
      type: object
      required: [data, links]
      properties:
        data:
          type: array
          items:
            type: string
        links:
          $ref: "#/components/schemas/Links"

    DataEnvelopeDeviceStatusList:
      type: object
      required: [data, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceStatus"
        links:
          $ref: "#/components/schemas/Links"

    DataEnvelopeObject:
      type: object
      required: [data]
      properties:
        data:
          description: Interface data (shape depends on interface type and path).
          type: object

    DataEnvelopeStringArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: string

    Links:
      type: object
      required: [self]
      properties:
        self:
          type: string
          description: Current page URL.
        next:
          type: string
          description: Next page URL (absent on last page).

    # ── Error envelopes ──

    ErrorDetail:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          required: [detail]
          properties:
            detail:
              type: string

    FieldErrorsDetail:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Per-field error messages (changeset shape).

  responses:
    BadRequest:
      description: Bad Request — malformed or missing data envelope.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Bad Request

    Unauthorized:
      description: Unauthorized — missing or invalid JWT.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Unauthorized

    NotFound:
      description: Not Found — resource does not exist.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Not Found

    DeviceNotFound:
      description: Device not found — unknown device ID.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Device not found

    MethodNotAllowed:
      description: Method Not Allowed — cannot write to a device-owned or read-only resource.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Cannot write to read-only resource

    InternalServerError:
      description: Internal Server Error — unexpected failure.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Internal Server Error

    ValidationErrors:
      description: Validation Error — one or more fields failed validation.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/FieldErrorsDetail"
          example:
            errors:
              group_name:
                - can't be blank

    ValueTooLarge:
      description: Unprocessable Entity — the value is larger than the per-value size limit (64 KiB).
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Value size exceeds size limits

    UnprocessableEntity:
      description: Unprocessable Entity — attribute key not found on device.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Attribute key not found

    ConflictAliasInUse:
      description: Conflict — the alias value is already owned by another device.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Alias already in use
