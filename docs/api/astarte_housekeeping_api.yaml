openapi: "3.0.3"
info:
  title: Astarte Housekeeping API
  description: |
    Instance-level administration API for Astrate. Manages realms — create, list,
    inspect, and delete them. All endpoints are guarded by an instance-level JWT
    carrying the `a_ha` claim.

    This API surface mirrors the upstream Astarte Housekeeping API paths and
    envelope conventions for wire compatibility.
  version: "0.0.1"
  license:
    name: "Apache-2.0 with SECO Exclusion"
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: "{base_url}"
    variables:
      base_url:
        default: http://localhost:8080
        description: Astrate base URL

security: []

paths:
  /housekeeping/v1/realms:
    get:
      operationId: listRealms
      summary: List all realms
      description: Returns the names of all configured realms, wrapped in a data envelope.
      tags: [Housekeeping]
      security:
        - a_ha: []
      responses:
        "200":
          description: A list of realm names.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRealmNames"
              example:
                {"data":["test","production"]}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createRealm
      summary: Create a new realm
      description: |
        Creates a new realm. The request body is wrapped in a data envelope and
        contains the realm name, the JWT public key PEM, and an optional device
        registration limit.
      tags: [Housekeeping]
      security:
        - a_ha: []
      parameters:
        - $ref: "#/components/parameters/AsyncOperation"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/RealmCreate"
            example:
              data:
                realm_name: test
                jwt_public_key_pem: |
                  -----BEGIN PUBLIC KEY-----
                  MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
                  -----END PUBLIC KEY-----
                device_registration_limit: 100
      responses:
        "201":
          description: Realm created successfully.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRealm"
              example:
                data:
                  realm_name: test
                  jwt_public_key_pem: |
                    -----BEGIN PUBLIC KEY-----
                    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
                    -----END PUBLIC KEY-----
                  device_registration_limit: 100
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /housekeeping/v1/realms/{realm}:
    get:
      operationId: getRealm
      summary: Get a realm by name
      description: Returns the full representation of a single realm.
      tags: [Housekeeping]
      security:
        - a_ha: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      responses:
        "200":
          description: Realm details.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRealm"
              example:
                data:
                  realm_name: test
                  jwt_public_key_pem: |
                    -----BEGIN PUBLIC KEY-----
                    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
                    -----END PUBLIC KEY-----
                  device_registration_limit: 100
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: patchRealm
      summary: Update a realm
      description: |
        Updates one or more fields of an existing realm. Anything not named here
        is rejected with `invalid_update_parameters`. A null
        `device_registration_limit` or `datastream_maximum_storage_retention`
        clears that field. For `datastream_maximum_storage_retention`, an
        explicit `0` clears it too: 0 is folded to unset, so it cannot ask for
        a literal zero-second retention, and the realm is left unlimited
        (upstream parity, measured on Astarte v1.2.0). `device_registration_limit`
        has no such fold — `0` there is stored as the literal limit `0`, and
        only `null` clears it. Returns 200 with an empty body on success.
      tags: [Housekeeping]
      security:
        - a_ha: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/RealmPatch"
            example:
              data:
                jwt_public_key_pem: |
                  -----BEGIN PUBLIC KEY-----
                  MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
                  -----END PUBLIC KEY-----
                device_registration_limit: 100
                datastream_maximum_storage_retention: 3600
      responses:
        "200":
          description: Realm updated successfully. No body returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteRealm
      summary: Delete a realm
      description: Deletes a realm and all its data. Returns 204 on success.
      tags: [Housekeeping]
      security:
        - a_ha: []
      parameters:
        - $ref: "#/components/parameters/RealmName"
        - $ref: "#/components/parameters/AsyncOperation"
      responses:
        "204":
          description: Realm deleted successfully. No body returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableDeletion"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    a_ha:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Instance-level JWT carrying the `a_ha` claim. Used to authenticate
        housekeeping operations (realm CRUD).

  parameters:
    RealmName:
      name: realm
      in: path
      required: true
      description: |
        The realm name: a lowercase ASCII word starting with a letter, so
        `TEST`, `test_realm`, `test-realm`, `1test`, `tëst` and `test realm`
        are not realm names — no realm can be created under one. This parameter
        is the read path though, and there an off-pattern name is not reported
        as malformed: it is answered with the same `404` and
        `{"errors":{"detail":"Not Found"}}` body as a realm that does not
        exist, because the lookup matches the name verbatim with no format check
        of its own.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*$'

    AsyncOperation:
      name: async_operation
      in: query
      required: false
      description: |
        Accepted and ignored on either value. Upstream 1.4 runs this operation in
        the background and lets the caller opt into synchronous execution with
        `async_operation=false`; Astrate always works synchronously and answers
        only once the work is done, so the value changes nothing and the
        response is identical either way (deviation 17 in COMPATIBILITY.md).
      schema:
        type: boolean
        default: false

  schemas:
    # ── Envelope variants ──

    DataEnvelopeRealm:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Realm"

    DataEnvelopeRealmNames:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: string
          description: List of realm names.

    Realm:
      type: object
      required: [realm_name, jwt_public_key_pem]
      properties:
        realm_name:
          type: string
          description: Unique realm identifier.
        jwt_public_key_pem:
          type: string
          description: PEM-encoded public key used to verify realm JWTs.
        device_registration_limit:
          type: integer
          format: int32
          nullable: true
          description: Maximum number of devices allowed in this realm. Null means unlimited.
        datastream_maximum_storage_retention:
          type: integer
          format: int64
          nullable: true
          description: Maximum datastream storage retention in seconds. Null means unlimited.

    RealmCreate:
      type: object
      required: [realm_name, jwt_public_key_pem]
      properties:
        realm_name:
          type: string
          pattern: '^[a-z][a-z0-9]*$'
          description: |
            Unique realm identifier: a lowercase ASCII word starting with a
            letter, so `TEST`, `test_realm`, `test-realm`, `1test`, `tëst` and
            `test realm` are refused. The pattern is the realm row's own CHECK
            constraint, so the database is what refuses an off-pattern name,
            not a check in the handler: the rejection arrives as a 422 only
            after the realm CA has been minted and sealed and is then thrown
            away. Empty is a different failure with a different message — see
            the 422 response.
        jwt_public_key_pem:
          type: string
          description: PEM-encoded public key used to verify realm JWTs.
        device_registration_limit:
          type: integer
          format: int32
          nullable: true
          description: |
            Maximum number of devices allowed in this realm. Null means unlimited.
            An explicit `0` is kept literally and is not the same as null: the
            limit is then reached before the first device, so nothing can
            register. Only `null` clears the limit.
        datastream_maximum_storage_retention:
          type: integer
          format: int64
          nullable: true
          description: |
            Maximum datastream storage retention in seconds. Null means unlimited.
            An explicit `0` is folded to unset and means unlimited, not a literal
            zero-second retention; unlike omitting the field it does not pick up
            the deployment's configured default retention.

    RealmPatch:
      type: object
      properties:
        jwt_public_key_pem:
          type: string
          nullable: true
          description: PEM-encoded public key used to verify realm JWTs. Omitted leaves the key unchanged.
        device_registration_limit:
          type: integer
          format: int32
          nullable: true
          description: |
            Maximum number of devices allowed in this realm. Null means unlimited.
            An explicit `0` is stored literally and admits no device, so it is
            not the same as null: only `null` means unlimited.
        datastream_maximum_storage_retention:
          type: integer
          format: int64
          nullable: true
          description: |
            Maximum datastream storage retention in seconds. Null clears the
            retention. `0` clears it as well: 0 is folded to unset, so it cannot
            ask for a literal zero-second retention and the realm is left
            unlimited (upstream parity, measured on Astarte v1.2.0).

    # ── Error envelopes ──

    ErrorDetail:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          required: [detail]
          properties:
            detail:
              type: string
              description: Human-readable error detail string.
          example:
            detail: Bad request

    FieldErrorsDetail:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Per-field error messages (changeset shape).

  responses:
    BadRequest:
      description: Bad Request — malformed or missing data envelope.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Bad request

    Unauthorized:
      description: Unauthorized — missing or invalid JWT.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Unauthorized

    Forbidden:
      description: Forbidden — valid JWT but insufficient permissions.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Forbidden

    NotFound:
      description: Not Found — resource does not exist.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Not Found

    MethodNotAllowed:
      description: Method Not Allowed — realm deletion is disabled for this deployment.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Realm deletion disabled

    ValidationErrors:
      description: Unprocessable Entity — update parameters failed validation.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/FieldErrorsDetail"
          example:
            errors:
              error_name:
                - invalid_update_parameters

    UnprocessableDeletion:
      description: Unprocessable Entity — realm has devices still connected and cannot be deleted.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/FieldErrorsDetail"
          example:
            errors:
              error_name:
                - connected_devices_present

    Conflict:
      description: Conflict — resource already exists (e.g. realm name taken).
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Realm already exists

    ValidationError:
      description: |
        Unprocessable Entity — request body failed validation. The two
        `realm_name` rejections partition the cases and neither overlaps: an
        empty name is refused by the handler with `realm_name can't be blank`,
        a non-empty name off the `^[a-z][a-z0-9]*$` pattern is refused by the
        realm row's CHECK constraint with `realm_name is invalid`.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          examples:
            blank_name:
              summary: Empty realm_name — refused by the handler
              value:
                errors:
                  detail: "realm_name can't be blank"
            off_pattern_name:
              summary: Non-empty realm_name off the pattern — refused by the database
              value:
                errors:
                  detail: realm_name is invalid

    InternalServerError:
      description: Internal Server Error — unexpected failure.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            errors:
              detail: Internal server error
